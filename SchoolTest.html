<title>高中英文單字隨身背</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234460c8'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EAB%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f111a; --panel:#191c2b; --panel2:#222639; --line:#2e3450;
    --txt:#e6e8f0; --dim:#9aa1bb; --accent:#7aa2ff;
    --good:#4dd08a; --bad:#ff7a8a; --warn:#ffc46b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;}
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
  #app{max-width:520px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom));}
  header{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
  header .ttl{font-size:19px;font-weight:700;letter-spacing:.3px}
  header .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .back{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:8px 12px;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .bar{height:9px;background:#0b0d15;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#7aa2ff,#4dd08a);width:0;transition:width .3s}
  .rowline{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin:8px 2px 0}
  button{font-family:inherit}
  .btn{display:block;width:100%;min-height:56px;border-radius:16px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:17px;font-weight:600;margin-bottom:10px;padding:14px 16px;text-align:left}
  .btn:active{transform:scale(.985)}
  .btn .em{font-size:20px;margin-right:10px}
  .btn .hint{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px;margin-left:30px}
  .btn.primary{background:linear-gradient(180deg,#4460c8,#3a51ae);border-color:#5a76dd}
  .btn.good{background:#1f4a38;border-color:#2f6c52}
  .btn.bad{background:#4a2330;border-color:#6d3444}
  .btn.ghost{background:transparent}
  .btn[disabled]{opacity:.45}
  /* 學習卡 */
  .cardbox{position:relative;perspective:1200px;margin:6px 0 14px}
  .flipper{position:relative;width:100%;min-height:280px;transition:transform .45s;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;}
  .cardbox.flipped .flipper{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .face.front{background:linear-gradient(160deg,#20253a,#171a29);border:1px solid var(--line)}
  .face.back{background:linear-gradient(160deg,#22402f,#1a2b23);border:1px solid #2f6c52;transform:rotateY(180deg)}
  .en{font-size:40px;font-weight:800;letter-spacing:.5px;line-height:1.15;word-break:break-word}
  .zh{font-size:32px;font-weight:800;line-height:1.3}
  .spk{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;
    color:var(--txt);padding:9px 18px;font-size:15px}
  .tipline{text-align:center;color:var(--dim);font-size:13px;margin-top:6px}
  .note{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.6;max-width:280px}
  /* 選擇題／拼字 */
  .qbox{background:linear-gradient(160deg,#20253a,#171a29);border:1px solid var(--line);border-radius:20px;
    padding:22px 16px;text-align:center;margin-bottom:14px;min-height:130px;display:flex;flex-direction:column;justify-content:center;
    position:relative}
  .qword{font-size:34px;font-weight:800;word-break:break-word}
  .qzh{font-size:28px;font-weight:800}
  .qtag{font-size:12px;color:var(--dim);margin-bottom:10px;letter-spacing:1px}
  .opt{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:17px;margin-bottom:9px;padding:12px 14px;text-align:left}
  .opt .idx{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#0e1120;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim)}
  .opt.right{background:#1f4a38;border-color:var(--good);animation:pop .38s ease-out}
  .opt.wrong{background:#4a2330;border-color:var(--bad);animation:shake .42s ease-out}
  .opt.dim{opacity:.45}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}55%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
  input[type=text]{width:100%;min-height:58px;border-radius:14px;border:1px solid var(--line);background:#0b0d15;
    color:var(--txt);font-size:22px;padding:12px 14px;letter-spacing:1px;text-align:center}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .hintline{text-align:center;color:var(--warn);font-size:18px;letter-spacing:3px;margin:12px 0;font-family:ui-monospace,Consolas,monospace}
  .fbline{text-align:center;font-size:18px;font-weight:800;min-height:28px;margin:8px 0 4px}
  .fbline.ok{color:var(--good)} .fbline.no{color:var(--bad)}
  .fbsub{text-align:center;font-size:14px;color:var(--dim);min-height:20px;margin-bottom:6px;word-break:break-word}
  /* 回饋動畫層 */
  .stamp{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:120px;font-weight:900;
    pointer-events:none;z-index:60;line-height:1;animation:stampIn .85s ease-out forwards}
  .stamp.ok{color:var(--good);text-shadow:0 0 34px rgba(77,208,138,.65)}
  .stamp.no{color:var(--bad);text-shadow:0 0 34px rgba(255,122,138,.65)}
  @keyframes stampIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-20deg)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(-8deg)}
    68%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.06) rotate(-8deg)}}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:50;animation:flashOut .65s ease-out forwards}
  .flash.ok{background:radial-gradient(circle at 50% 36%, rgba(77,208,138,.38), rgba(77,208,138,0) 70%)}
  .flash.no{background:radial-gradient(circle at 50% 36%, rgba(255,122,138,.38), rgba(255,122,138,0) 70%)}
  @keyframes flashOut{from{opacity:1}to{opacity:0}}
  .streak{display:inline-block;background:#2a2350;border:1px solid #4b3fa0;color:#cfc6ff;
    border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;margin-left:6px;animation:pop .4s ease-out}
  .streak.hot{background:#4a2a10;border-color:#a35d1d;color:#ffd9a3}
  /* 清單 */
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .item .w{font-size:17px;font-weight:700}
  .item .z{font-size:13px;color:var(--dim);margin-top:2px}
  .item .dot{width:8px;height:8px;border-radius:50%;background:#3a4160;flex:0 0 8px}
  .item .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
  .item .acts{margin-left:auto;display:flex;gap:8px}
  .mini{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 11px;font-size:13px}
  .switchrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px;font-weight:600}
  .switchrow .sub{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px}
  .switchrow input{width:24px;height:24px;margin-left:auto;flex:0 0 24px}
  .empty{text-align:center;color:var(--dim);padding:26px 10px;font-size:14px;line-height:1.7}
  .stat{display:flex;gap:10px;margin-bottom:12px}
  .stat > div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:var(--dim)}
  .big{font-size:44px;text-align:center;margin:6px 0;animation:pop .5s ease-out}
  .center{text-align:center}
  .foot{text-align:center;color:#5d6484;font-size:11px;margin-top:14px;line-height:1.7}
  .diag{font-size:12px;color:var(--dim);line-height:1.8;background:#0b0d15;border:1px solid var(--line);
    border-radius:12px;padding:12px;word-break:break-word}
  /* 範圍選擇 */
  .chips{display:flex;gap:8px}
  .chip{flex:1;min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    font-size:17px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px}
  .chip .n{font-size:11px;color:var(--dim);font-weight:400}
  .chip.on{background:linear-gradient(180deg,#4460c8,#3a51ae);border-color:#5a76dd}
  .chip.on .n{color:#dfe6ff}
  .chip:active{transform:scale(.97)}
  .grp{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:800;
    color:var(--accent);margin:16px 2px 8px}
  .grp span{font-size:11px;color:var(--dim);font-weight:400}
  /* 6 顆分級 chips：窄畫面自動排成 3＋3；最後一排不會被拉寬 */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:0 0 calc(33.333% - 6px);min-width:82px;min-height:56px}
  textarea{width:100%;border-radius:14px;border:1px solid var(--line);background:#0b0d15;color:var(--txt);
    font-size:15px;padding:12px;font-family:inherit;line-height:1.7;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .flab{font-size:13px;color:var(--dim);margin:12px 0 6px}
  .flab:first-child{margin-top:0}
  .lvtip{background:#1a2136;border:1px solid #33406b;border-radius:16px;padding:14px;
    font-size:13px;color:#c2cdf0;line-height:1.8;margin-bottom:12px}
  .lvtip b{color:#e6ecff}
  code{background:#0b0d15;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px}
  .item > div:first-child{min-width:0}
  .item .acts{flex-wrap:wrap;justify-content:flex-end}
</style>
</head>

/* 分級不寫死：預設六級，之後新增的存進 S.levels，程式完全照著跑 */
const DEFLEVELS = ["L1","L2","L3","核13","核14","核15"];
let LEVELS = [];            /* 分級編號，依 S.levels 的順序＝1,2,3… */
let LVNAME = {};            /* 編號 → 顯示名稱 */
const BAKEDCNT = BAKED.length;
let WORDS = [];              /* 實際使用的清單＝內建 − 刪除 ＋ 自訂（另套用修改） */
let TOTAL = 0;
const LSKEY = "vocab_high_en_v3";
const LSOLD = "vocab_high_en_v2";
/* ================= 設定與進度 ================= */
const DEFSET = {sfx:true, auto:true, vib:true, range:null};   /* range=null ⇒ 全部級別 */
const DEF = {learned:[], wrong:[], q:0, right:0, last:0, set:{}, custom:[], edit:{}, del:[], levels:DEFLEVELS.slice()};

syncLevels();            /* 建分級表（load 內部已依 levels 修好範圍） */

function newId(){ return "u" + Date.now().toString(36) + Math.floor(Math.random()*46656).toString(36); }
function bakedId(i){ return "b" + i; }

/* 由「內建 − 刪除 ＋ 自訂」再套用修改，組出實際清單 */
function rebuild(){
  const out = [];
  for(let k=0;k<BAKED.length;k++){
    const id = bakedId(k);
    if(S.del.indexOf(id)>=0) continue;
    const e = S.edit[id], base = BAKED[k];
    out.push(e ? {id:id, w:e.w, z:e.z, lv:e.lv} : {id:id, w:base.w, z:base.z, lv:base.lv});
  }
  const cs = Array.isArray(S.custom) ? S.custom : [];
  for(let k=0;k<cs.length;k++){
    const c = cs[k];
    if(S.del.indexOf(c.id)>=0) continue;
    const e = S.edit[c.id];
    out.push(e ? {id:c.id, w:e.w, z:e.z, lv:e.lv} : {id:c.id, w:c.w, z:c.z, lv:c.lv});
  }
  WORDS = out;
  TOTAL = WORDS.length;
}
/* 舊版的進度存的是「第幾個字」（數字），換算成穩定編號；已刪字也不會亂 */
function convIDs(a){
  if(!Array.isArray(a)) return [];
  const out = [];
  for(let k=0;k<a.length;k++){
    const v = a[k];
    if(typeof v === "string"){ if(out.indexOf(v)<0) out.push(v); }
    else if(typeof v === "number" && v>=0 && v<BAKEDCNT){ const id = bakedId(v); if(out.indexOf(id)<0) out.push(id); }
  }
  return out;
}
function load(){ return load2(null); }
/* 從一份物件組出狀態（o=null 表示從瀏覽器讀） */
function load2(src){
  let o = src || null;
  if(!o){
    try{ const raw = localStorage.getItem(LSKEY); if(raw) o = JSON.parse(raw); }catch(e){}
  }
  if(!o){
    try{
      const old = localStorage.getItem(LSOLD);
      if(old){
        const p = JSON.parse(old) || {};
        o = {learned:p.learned, wrong:p.wrong, q:p.q||0, right:p.right||0, last:p.last||0, set:p.set};
        /* 這次多了三個分級，一次幫他打開；原本勾的照舊保留 */
        if(o.set && Array.isArray(o.set.range) && o.set.range.length){
          /* v2 只有 1~3 級；新的級別一次幫他打開，原本勾的照舊 */
          for(let k=1;k<=DEFLEVELS.length;k++) if(o.set.range.indexOf(k)<0) o.set.range.push(k);
        }
      }
    }catch(e){}
  }
  if(!o) o = {};
  const lvls = (Array.isArray(o.levels) && o.levels.length) ? o.levels.map(function(x){ return String(x); }) : DEFLEVELS.slice();
  const lvlsIdx = lvls.map(function(_, k){ return k+1; });
  return {
    learned: convIDs(o.learned), wrong: convIDs(o.wrong),
    q: o.q||0, right: o.right||0, last: o.last||0,
    set: fixSet(o.set, lvlsIdx),
    custom: Array.isArray(o.custom)?o.custom:[],
    edit: (o.edit && typeof o.edit==="object")?o.edit:{},
    del: Array.isArray(o.del)?o.del:[],
    levels: lvls
  };
}
let saveWarned = false;
function save(){

  catch(e){
    if(saveWarned) return; saveWarned = true;
    try{ alert("這台裝置的儲存空間滿了，剛才的變更可能沒存進去。\n請先「匯出備份」，或刪掉一些自訂單字再試。"); }catch(e2){}
  }
}
const SET = new Proxy({}, {
  get:function(t,k){ return S.set[k]; },
  set:function(t,k,v){ S.set[k] = v; save(); return true; }

/* ================= 小工具 ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function range(a,b){ const r=[]; for(let i=a;i<b;i++) r.push(i); return r; }
function lvName(lv){ return LVNAME[lv] || ("分級"+lv); }
/* 依 S.levels 重建分級表；名稱重複或空白的自動補正 */
function syncLevels(){
  if(!Array.isArray(S.levels) || !S.levels.length) S.levels = DEFLEVELS.slice();
  const seen = {}, out = [];
  for(let k=0;k<S.levels.length;k++){
    let n = String(S.levels[k]||"").trim();
    if(!n){                                  /* 空白 → 自動取名，且不與現有撞名 */
      let g = k + 1;
      while(seen[("分級" + g).toLowerCase()]) g++;
      n = "分級" + g;
    }
    const key = n.toLowerCase().replace(/\s+/g, "");
    if(seen[key]) continue;                  /* 同名（忽略大小寫與空白）→ 直接移除這個重複項 */
    seen[key] = 1;
    out.push(n);
  }
  S.levels = out;
  LEVELS = []; LVNAME = {};
  for(let k=0;k<S.levels.length;k++){ LEVELS.push(k+1); LVNAME[k+1] = S.levels[k]; }
}
function lvCountAll(){ return LEVELS.length; }
/* 目前使用的分級名稱 ↔ 編號 */
function lvByName(name){
  const t = String(name||"").trim();
  if(!t) return -1;
  const sq = t.replace(/\s+/g, "");
  const low = t.toLowerCase(), lows = sq.toLowerCase();
  for(let k=0;k<S.levels.length;k++){
    const n = String(S.levels[k]);
    if(n === t || n === sq || n.toLowerCase() === low || n.toLowerCase() === lows) return k+1;
  }
  return -1;
}
/* 新增一個分級（回傳新編號） */
function addLevel(name){
  let n = String(name||"").trim();
  if(!n) n = "分級" + (S.levels.length+1);
  const ex = lvByName(n);          /* 已含忽略大小寫與空白 */
  if(ex >= 0) return ex;
  S.levels.push(n);
  syncLevels();
  return lvByName(n);
}
function lvIdx(lv){ const out=[]; for(let k=0;k<WORDS.length;k++) if(WORDS[k].lv===lv) out.push(k); return out; }
function lvCount(lv){ return lvIdx(lv).length; }
/* 目前勾選的範圍（回傳單字索引陣列） */
function scopeIdx(){ const out=[]; for(let k=0;k<WORDS.length;k++) if(S.set.range.indexOf(WORDS[k].lv)>=0) out.push(k); return out; }
function scopeLabel(){
  const on=[]; for(let k=0;k<LEVELS.length;k++) if(S.set.range.indexOf(LEVELS[k])>=0) on.push(lvName(LEVELS[k]));
  if(!on.length) return "未選";
  if(on.length === LEVELS.length) return "全部 " + LEVELS.length + " 級";
  if(on.length > 4) return "已選 " + on.length + " 級";
  return on.join("＋");
}
/* 讀回設定時把範圍修回合法值（至少留一個 L） */
function fixSet(o, lvlsIdx){
  const L = (Array.isArray(lvlsIdx) && lvlsIdx.length) ? lvlsIdx : LEVELS;
  const s = Object.assign({}, DEFSET, o||{});
  const r = [];
  if(Array.isArray(s.range)){
    for(let k=0;k<L.length;k++) if(s.range.indexOf(L[k])>=0) r.push(L[k]);
  }
  s.range = r.length ? r : L.slice();   /* 沒指定或全部失效 ⇒ 全部級別 */
  s.sfx = !!s.sfx; s.auto = !!s.auto; s.vib = !!s.vib;
  return s;
}
/* 拼字比對用：彎引號、全形括號、省略號一律視為同一種打法 */
function normSpell(s){
  return String(s||"").toLowerCase()
    .replace(/[\u2018\u2019\u02bc\u2032]/g,"'")
    .replace(/[\u201c\u201d]/g,"\"")
    .replace(/（/g,"(").replace(/）/g,")")
    .replace(/\u2026/g,"...")
    .replace(/\u00a0/g," ")
    .replace(/\s+/g," ")
    .replace(/\s*\.\.\.\s*/g,"...")   /* 「pass on ... to ...」也算對 */
    .trim();
}
/* 出題池：null＝依目前勾選範圍；wrong＝錯題本（不受範圍限制） */
function poolOf(pool){
  if(pool === "wrong") return wrongIdx();
  return null;
}
function tagOf(pool){ return pool === "wrong" ? "wrong" : ""; }
/* 出題索引：優先用傳進來的池，沒有就用目前勾選範圍 */
function poolIdx(pool, tag){
  if(pool && pool.length) return pool.slice();
  if(tag === "wrong") return wrongIdx();
  return scopeIdx();
}
function poolName(tag){
  if(tag === "wrong") return "錯題本";
  return "範圍 " + scopeLabel();
}

function idAt(i){ return WORDS[i] ? WORDS[i].id : null; }
function idxById(id){ for(let k=0;k<WORDS.length;k++) if(WORDS[k].id===id) return k; return -1; }
function wordById(id){ const i = idxById(id); return i<0 ? null : WORDS[i]; }
function isLearned(i){ const id=idAt(i); return id ? S.learned.indexOf(id)>=0 : false; }
function isWrong(i){ const id=idAt(i); return id ? S.wrong.indexOf(id)>=0 : false; }
function markLearned(i){ const id=idAt(i); if(id && S.learned.indexOf(id)<0) S.learned.push(id); }
function addWrong(i){ const id=idAt(i); if(id && S.wrong.indexOf(id)<0) S.wrong.push(id); }
function delWrong(i){ const id=idAt(i); if(!id) return; const k=S.wrong.indexOf(id); if(k>=0) S.wrong.splice(k,1); }
function delWrongId(id){ const k=S.wrong.indexOf(id); if(k>=0) S.wrong.splice(k,1); }
/* 錯題本存的是編號 → 換算成目前的索引（已刪除的字自動略過） */
function wrongIdx(){
  const out = [];
  for(let k=0;k<S.wrong.length;k++){ const i = idxById(S.wrong[k]); if(i>=0) out.push(i); }
  return out;
}

/* ================= 音效（WebAudio，不需任何音檔） ================= */
let AC = null;
function ac(){
  try{
    if(!AC){
      const C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      AC = new C();
    }
    if(AC.state === "suspended"){ try{ AC.resume(); }catch(e){} }
    return AC;
  }catch(e){ return null; }
}
function tone(freq, delay, dur, type, vol){
  const c = ac(); if(!c) return;
  try{
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(c.destination);
    const t0 = c.currentTime + (delay||0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol||0.16, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.15));
    o.start(t0); o.stop(t0+(dur||0.15)+0.03);
  }catch(e){}
}
function sfx(kind, streak){
  if(!SET.sfx) return;
  if(kind==="right"){
    tone(659.25, 0,    0.12, "triangle", 0.16);
    tone(987.77, 0.085,0.18, "triangle", 0.15);
    if(streak && streak>=3) tone(1318.5, 0.19, 0.24, "triangle", 0.15);
    if(streak && streak>=5) tone(1567.98,0.28, 0.28, "sine", 0.12);
  }else if(kind==="wrong"){
    tone(233.08, 0,    0.17, "sine", 0.15);
    tone(155.56, 0.14, 0.28, "sine", 0.15);
  }else if(kind==="card"){
    tone(880, 0, 0.14, "sine", 0.13);
  }else if(kind==="tap"){
    tone(1200, 0, 0.05, "sine", 0.06);
  }
}
function buzz(kind){
  if(!SET.vib) return;
  try{
    if(!navigator.vibrate) return;
    if(kind==="right") navigator.vibrate(28);
    else if(kind==="wrong") navigator.vibrate([45,70,45]);
  }catch(e){}
}

/* ================= 語音朗讀 ================= */
let voice = null;
function pickVoice(){
  try{
    const s = window.speechSynthesis; if(!s) return null;
    const vs = s.getVoices() || [];
    if(!vs.length) return null;
    const want = ["Google US English","Samantha","Aria","Ava","Zira","Jenny","Karen","Daniel","Google UK English Female"];
    for(let k=0;k<want.length;k++){
      for(let j=0;j<vs.length;j++){
        if(vs[j].name && vs[j].name.indexOf(want[k])>=0 && /^en/i.test(vs[j].lang||"")) return vs[j];
      }
    }
    for(let j=0;j<vs.length;j++){ if(/^en[-_]US/i.test(vs[j].lang||"")) return vs[j]; }
    for(let j=0;j<vs.length;j++){ if(/^en/i.test(vs[j].lang||"")) return vs[j]; }
  }catch(e){}
  return null;
}
function refreshVoice(){ const v = pickVoice(); if(v) voice = v; }
if(window.speechSynthesis){
  refreshVoice();
  try{ window.speechSynthesis.onvoiceschanged = refreshVoice; }catch(e){}
}
/* 修正關鍵：cancel() 之後「同一個瞬間」再 speak，Chrome 會把新的那句吃掉 → 一律延後再唸 */
function speak(text, rate){
  try{
    const s = window.speechSynthesis; if(!s) return;
    const t = String(text||"").replace(/\.\.\./g," ").trim();
    if(!t) return;
    if(!voice) refreshVoice();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = (voice && voice.lang) ? voice.lang : "en-US";
    u.rate = rate || 0.85; u.pitch = 1; u.volume = 1;
    if(voice) u.voice = voice;
    const fire = function(){ try{ s.speak(u); }catch(e){} };
    if(s.speaking || s.pending){ try{ s.cancel(); }catch(e){} setTimeout(fire, 150); }
    else fire();
  }catch(e){}
}
/* 只唸一次（避免畫面重繪時重複朗讀） */
let spokenToken = null;
function speakOnce(token, text, rate){
  if(spokenToken === token) return;
  spokenToken = token;
  speak(text, rate);
}
/* 手機解鎖：iOS 需要在第一次使用者觸碰時才允許語音與音效 */
let unlocked = false;
function unlockMedia(){
  if(unlocked) return; unlocked = true;
  ac();
  try{
    const s = window.speechSynthesis;
    if(s){
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0; u.lang = "en-US"; u.rate = 1.2;
      s.speak(u);
    }
  }catch(e){}
  refreshVoice();
}
["touchstart","pointerdown","keydown"].forEach(function(ev){

/* iPhone 專屬提醒：Safari 對「7 天沒打開的網站」會清掉儲存空間，加到主畫面可豁免 */
function iosTip(){

         'iPhone 的 Safari 有個規則：<b>超過七天沒打開的網站，儲存資料會被清掉</b>（進度會歸零）。'+
         '把這個網頁加到主畫面就不受這條規則管，而且開起來像個 App。<br>'+
         '做法：Safari 底下按<b>分享 ⬆️</b> → <b>加入主畫面</b>。<br>'+

let cardState = {order:[], pos:0, flipped:false, base:null, tag:""};

function viewCard(){

           '<div class="face back"><div class="zh">'+esc(w.z)+'</div><div class="spk" style="margin-top:14px">'+esc(w.w)+'</div>'+

  h += '<button class="btn bad" data-act="unknown"><span class="em">🔁</span>不熟，再練一次<span class="hint">會排到後面，並進錯題本</span></button>';
  h += '<button class="btn ghost" data-act="flip">🔄 翻面</button>';

}
function cardKnown(){
  const i = cardState.order[cardState.pos];
  markLearned(i); delWrong(i); save();
  sfx("card"); buzz("right");
  cardState.order.splice(cardState.pos,1);
  if(cardState.pos>=cardState.order.length) cardState.pos = cardState.order.length-1;
  if(cardState.order.length===0){ go("home"); } else { cardState.flipped=false; render(); }
}
function cardUnknown(){
  const i = cardState.order[cardState.pos];
  addWrong(i); save();
  sfx("wrong"); buzz("wrong");
  cardState.order.splice(cardState.pos,1);
  cardState.order.push(i);
  if(cardState.pos>=cardState.order.length) cardState.pos = 0;
  cardState.flipped = false;
  suppressAuto = true;   /* 這張不要讓自動朗讀插隊，等一下只唸「不熟的那個字」 */
  render();
  speak(WORDS[i].w);
}

/* ---------- 選擇題 ---------- */
let quizState = {mode:"en2zh", qs:[], pos:0, right:0, picked:null, pool:null, opts:null, streak:0, best:0, ptag:""};
let lastRun = {type:"quiz", mode:"en2zh", pool:null};

function buildQuiz(mode, pool, tag){
  const idx = poolIdx(pool, tag);
  shuffle(idx);
  const n = Math.min(10, idx.length);
  quizState = {mode:mode, qs:idx.slice(0,n), pos:0, right:0, picked:null, pool:idx, opts:null, streak:0, best:0, ptag:tag||""};
  lastRun = {type:"quiz", mode:mode, pool:idx, tag:tag||""};
}
function makeOpts(ci, pool){
  const base = (pool && pool.length) ? pool : scopeIdx();
  const opts = [ci];
  let guard = 0;
  while(opts.length<4 && guard++<600){
    const r = base[Math.floor(Math.random()*base.length)];
    if(r===undefined || opts.indexOf(r)>=0) continue;
    if(WORDS[r].z === WORDS[ci].z || WORDS[r].w === WORDS[ci].w) continue;
    opts.push(r);
  }
  guard = 0;
  while(opts.length<4 && guard++<600){        /* 範圍內字太少時，用全部單字補滿四個選項 */
    const r = Math.floor(Math.random()*TOTAL);
    if(opts.indexOf(r)>=0) continue;
    if(WORDS[r].z === WORDS[ci].z || WORDS[r].w === WORDS[ci].w) continue;
    opts.push(r);
  }
  return shuffle(opts);
}
function viewQuiz(){
  if(!quizState.qs.length) buildQuiz(view.data.mode||"en2zh", null, "");
  const i = quizState.qs[quizState.pos];
  const w = WORDS[i];
  const en2zh = quizState.mode==="en2zh";
  const opts = quizState.opts || (quizState.opts = makeOpts(i, quizState.pool));
  const answered = quizState.picked !== null;
  const wasRight = answered && quizState.picked === i;

  let badge = "";
  if(quizState.streak>=2){
    badge = '<span class="streak'+(quizState.streak>=5?" hot":"")+'">連續答對 '+quizState.streak+'</span>';
  }
  let h = header("看英文選中文".replace("看英文選中文", en2zh?"看英文選中文":"看中文選英文"),
                 "第 "+(quizState.pos+1)+" / "+quizState.qs.length+" 題　答對 "+quizState.right+"　"+poolName(quizState.ptag), "home", badge);
  h += '<div class="bar"><i style="width:'+Math.round(quizState.pos*100/quizState.qs.length)+'%"></i></div>';
  h += '<div style="height:12px"></div>';
  h += '<div class="qbox"><div class="qtag">'+(en2zh?"這個字是什麼意思？":"這個意思的英文是？")+'</div>'+
        (en2zh?'<div class="qword">'+esc(w.w)+'</div><button class="spk" data-speak="'+esc(w.w)+'" style="margin-top:12px">🔊 再唸一次</button>'
              :'<div class="qzh">'+esc(w.z)+'</div>')+'</div>';
  const letters = ["A","B","C","D"];
  for(let k=0;k<opts.length;k++){
    const oi = opts[k];
    let cls = "opt";
    if(answered){
      if(oi===i) cls += " right";
      else if(oi===quizState.picked) cls += " wrong";
      else cls += " dim";
    }
    h += '<button class="'+cls+'" data-opt="'+oi+'"><span class="idx">'+letters[k]+'</span><span>'+
         esc(en2zh?WORDS[oi].z:WORDS[oi].w)+'</span>'+
         (answered && oi===i ? '　<span style="margin-left:auto">✓</span>' : '')+
         (answered && oi===quizState.picked && oi!==i ? '　<span style="margin-left:auto">✗</span>' : '')+
         '</button>';
  }
  if(answered){
    h += '<div class="fbline '+(wasRight?"ok":"no")+'">'+(wasRight?"✅ 答對了！":'❌ 答錯了')+'</div>'+
         '<div class="fbsub">'+(wasRight?'<span style="color:var(--good)">+1 學會</span>'+(quizState.streak>=3?'　🔥 連續答對 '+quizState.streak+' 題！':'')
                                        :'正確答案：'+esc(w.w)+'　（'+esc(w.z)+'）')+'</div>';
    h += '<div class="flash '+(wasRight?"ok":"no")+'"></div>';
    h += '<div class="stamp '+(wasRight?"ok":"no")+'">'+(wasRight?"✓":"✗")+'</div>';
  }
  return h;
}
function answer(oi){
  if(quizState.picked!=null) return;
  const i = quizState.qs[quizState.pos];
  const w = WORDS[i];
  quizState.picked = oi;
  S.q++;
  const ok = (oi===i);
  if(ok){ S.right++; quizState.right++; quizState.streak++; if(quizState.streak>quizState.best) quizState.best=quizState.streak; markLearned(i); delWrong(i); }
  else { quizState.streak = 0; addWrong(i); }
  save();
  sfx(ok?"right":"wrong", quizState.streak); buzz(ok?"right":"wrong");
  render();
  // 答完之後再唸一次正解單字（加深印象）
  speakOnce("ans:"+quizState.pos+":"+i, w.w, ok?0.85:0.7);
  setTimeout(function(){
    quizState.pos++; quizState.picked = null; quizState.opts = null;
    if(quizState.pos>=quizState.qs.length){
      go("result", {score:quizState.right, total:quizState.qs.length, best:quizState.best, mode:quizState.mode});
    }
    else render();
  }, ok?950:1500);
}

/* ---------- 拼字 ---------- */
let spellState = {qs:[], pos:0, right:0, checked:false, pool:null, typed:"", ok:null, streak:0, best:0, ptag:""};

function buildSpell(pool, tag){
  const idx = poolIdx(pool, tag);
  shuffle(idx);
  const n = Math.min(10, idx.length);
  spellState = {qs: idx.slice(0,n), pos:0, right:0, checked:false, pool:idx, typed:"", ok:null, streak:0, best:0, ptag:tag||""};
  lastRun = {type:"spell", mode:"spell", pool:idx, tag:tag||""};
}
function hintOf(str){
  let out = "";
  for(let k=0;k<str.length;k++){
    const c = str[k];
    /* 英文字母才要自己想，空白與標點（含… ’）照原樣露出 */
    if(/[A-Za-z]/.test(c)) out += (k===0 ? c : "_");
    else out += c;
  }
  return out;
}
function viewSpell(){
  if(!spellState.qs.length) buildSpell(null, "");
  const i = spellState.qs[spellState.pos];
  const w = WORDS[i];
  let badge = "";
  if(spellState.streak>=2) badge = '<span class="streak'+(spellState.streak>=5?" hot":"")+'">連續答對 '+spellState.streak+'</span>';
  let h = header("拼字測驗", "第 "+(spellState.pos+1)+" / "+spellState.qs.length+" 題　答對 "+spellState.right+"　"+poolName(spellState.ptag), "home", badge);
  h += '<div class="bar"><i style="width:'+Math.round(spellState.pos*100/spellState.qs.length)+'%"></i></div>';
  h += '<div style="height:12px"></div>';
  h += '<div class="qbox"><div class="qtag">請拼出這個意思的英文</div><div class="qzh">'+esc(w.z)+'</div>'+
       '<div class="hintline">'+esc(hintOf(w.w))+'（共 '+w.w.length+' 字元）</div></div>';
  h += '<input type="text" id="spellIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在這裡打英文" value="'+esc(spellState.typed||"")+'">';
  if(spellState.checked){
    h += '<div class="fbline '+(spellState.ok?"ok":"no")+'">'+(spellState.ok?"✅ 拼對了！":'❌ 拼錯了')+'</div>'+
         '<div class="fbsub">'+(spellState.ok?(spellState.streak>=3?'🔥 連續答對 '+spellState.streak+' 題！':'+1 學會')
                                      :'正確拼法：'+esc(w.w))+'</div>'+
         '<div class="flash '+(spellState.ok?"ok":"no")+'"></div>'+
         '<div class="stamp '+(spellState.ok?"ok":"no")+'">'+(spellState.ok?"✓":"✗")+'</div>';
    h += '<button class="btn primary" data-act="nextSpell">下一題</button>';
  }else{
    h += '<div class="fbline"></div><div class="fbsub">拼完後按下面的按鈕</div>';
    h += '<button class="btn primary" data-act="checkSpell">確定</button>';
  }
  h += '<button class="btn ghost" data-act="listen">🔊 聽發音提示</button>';
  return h;
}
function checkSpell(){
  if(spellState.checked) return;
  const i = spellState.qs[spellState.pos];
  const w = WORDS[i];
  const el = document.getElementById("spellIn");
  const ok = (normSpell(el?el.value:"") === normSpell(w.w));
  spellState.checked = true; spellState.ok = ok; spellState.typed = (el?el.value:"");
  S.q++;
  if(ok){ S.right++; spellState.right++; spellState.streak++; if(spellState.streak>spellState.best) spellState.best=spellState.streak; markLearned(i); delWrong(i); }
  else { spellState.streak = 0; addWrong(i); }
  save();
  sfx(ok?"right":"wrong", spellState.streak); buzz(ok?"right":"wrong");
  render();
  speakOnce("spans:"+spellState.pos+":"+i, w.w, ok?0.85:0.68);
  if(ok) setTimeout(nextSpell, 950);
}
function nextSpell(){
  spellState.pos++; spellState.checked=false; spellState.typed=""; spellState.ok=null;
  if(spellState.pos>=spellState.qs.length){
    go("result", {score:spellState.right, total:spellState.qs.length, best:spellState.best, mode:"spell"});
  }else{
    render(); const n=document.getElementById("spellIn"); if(n) n.focus();
  }
}

function delLevelFlow(lv){

              "已學會／錯題紀錄都會保留。";
  if(!confirm(msg)) return;
  /* 該級的字改掛到第一級 */
  const first = LEVELS[0];
  for(let k=0;k<S.custom.length;k++){ if(S.custom[k].lv === lv) S.custom[k].lv = first; }
  for(const id in S.edit){ if(S.edit[id].lv === lv) S.edit[id].lv = first; }
  /* 內建字改掛：記在 edit 上（底稿不動） */
  for(let k=0;k<BAKED.length;k++){
    const id = bakedId(k);
    if(S.del.indexOf(id)>=0) continue;
    const eff = S.edit[id] || BAKED[k];
    if(eff.lv === lv) S.edit[id] = {w:eff.w, z:eff.z, lv:first};
  }
 /* 移除分級，後面的編號往前補 */
  S.levels.splice(lv-1,1);
  const r = [];
  for(let k=0;k<S.set.range.length;k++){
    const v = S.set.range[k];

  cardState.order=[]; quizState.qs=[]; spellState.qs=[];
  render();
}

/* ---------- 批次匯入 ---------- */
/* 全形英數 → 半形（讓「Ｌ１」「１２」也能認） */
function halfWidth(str){
  return String(str||"")
    .replace(/[\uff01-\uff5e]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
    .replace(/\u3000/g, " ");
}
/* 這一段「像不像分級標題」：開頭是常見單位詞（可接阿拉伯或中文數字） */
function headingish(t){
  const x = halfWidth(String(t||"")).replace(/[：:]$/, "").replace(/\s+/g, "").trim();
  if(!x) return false;
  if(/^[Ll][Vv]?[0-9]+$/.test(x)) return true;
  const NUM = "(?:[0-9]+|[一二三四五六七八九十百]+)";
  return new RegExp("^(?:核|單元|章|課|回|級|班|篇|組|部|冊|本|Ch|Chapter|Unit|Lesson|Grade|Book|Lv|Level|Part|Section|Week|Day|Test|No)" + NUM + "$", "i").test(x);
}
/* 這一行是不是標題？
   ① 整行完全等於某個現有分級名稱 → 是（名稱可以是任意文字）
   ② 行首像「單位＋數字」（L1／核13／單元二／Unit 9／Chapter 3）→ 是
   ③ 都不是 → 不是
   ※ 回傳的是「原樣的名稱」（保留空白），顯示才好看；比對時另有忽略空白的規則 */
function headName(line){
  const raw = String(line||"").trim();
  if(!raw) return null;
  const flat = halfWidth(raw).replace(/[：:]\s*$/, "").trim();
  /* ① 現有分級名稱（任意文字） */
  if(lvByName(flat) >= 0) return flat;
  /* ② 行首的「單位＋數字」，允許中間有空白（Unit 9、Chapter 3） */
  const NUM = "(?:[0-9]+|[一二三四五六七八九十百]+)";
  const re2 = new RegExp("^\\s*(L\\s*[Vv]?\\s*" + NUM + "|(?:核|單元|章|課|回|級|班|篇|組|部|冊|本)\\s*" + NUM +
                         "|(?:Ch|Chapter|Unit|Lesson|Grade|Book|Lv|Level|Part|Section|Week|Day|Test)\\s*" + NUM + ")\\s*[：:]?", "i");
  const m = flat.match(re2);
  if(m) return halfWidth(m[1]).replace(/\s+$/, "").trim();   /* 保留中間空白（Unit 9） */
  return null;
}
/* 標題名 → 分級編號（對不上回 -1；不亂猜） */
function lvFromHeading(line){
  const t = String(line||"").replace(/[：:]\s*$/, "").trim();
  if(!t) return -1;
  return lvByName(t);          /* lvByName 已處理大小寫與空白；對不上就回 -1，不亂猜 */
}
/* 判斷這一行是不是「正常的單字列」（英文 中文）
   英文段至少要有一個英文字母，中文段不能是空的 */
function isWordLine(ln){
  if(/^[#＃]/.test(ln)) return false;
  if(/^(備註|說明|注意|附註)/.test(ln)) return false;
  const tab = ln.indexOf("\t");
  if(tab >= 0){
    const a = ln.slice(0,tab).trim(), b = ln.slice(tab+1).trim();
    return /[A-Za-z]/.test(a) && b.length > 0;
  }
  const m = ln.search(/[\u4e00-\u9fff\uff08\uff09]/);
  if(m <= 0) return false;
  const a = ln.slice(0,m).trim(), b = ln.slice(m).trim();
  return /[A-Za-z]/.test(a) && b.length > 0;
}
/* 這一行「看起來像不像一個標題」但還沒有對應分級：
   不是單字列、不是註解、短短的一行（<=16 字、不超過 3 個詞）→ 拿出來問使用者要不要建立 */
function maybeArbitraryHead(ln){
  if(/^[#＃]/.test(ln)) return null;
  if(/^(備註|說明|注意|附註)/.test(ln)) return null;
  if(isWordLine(ln)) return null;
  const t = halfWidth(ln).replace(/[：:]\s*$/, "").trim();
  if(!t || t.length > 16) return null;
  if(t.split(/\s+/).length > 3) return null;
  return t;
}
/* 解析貼上的清單（兩階段）：
   ① 先掃出所有候選標題
      - 完全等於現有分級名稱（任意文字）
      - 行首像「單位＋數字」（L1／核13／單元二／Unit 9／Chapter 3）
      - 其他短短的一行、又不像單字 → 也當候選（留給任意文字的標題）
   ② 再逐行分類：標題切換分級，其餘當單字 */
function parsePaste(txt){
  const raw = String(txt||"").split(/\r?\n/);
  const cand = {}, candName = {};
  for(let k=0;k<raw.length;k++){
    const ln = raw[k].replace(/^\s+|\s+$/g, "");
    if(!ln) continue;
    let name = headName(ln);
    if(name === null) name = maybeArbitraryHead(ln);
    if(name === null) continue;
    cand[k] = name;
    candName[name] = 1;
  }
  const unknown = [];
  for(const nm in candName){ if(lvByName(nm) < 0) unknown.push({name:nm}); }
  unknown.sort(function(a,b){ return a.name.localeCompare(b.name); });
  const rows = [], bad = [], heads = [];
  let curName = null, curLv = -1;
  for(let k=0;k<raw.length;k++){
    let ln = raw[k].replace(/^\s+|\s+$/g, "");
    if(!ln) continue;
    if(cand[k] !== undefined){
      curName = cand[k]; curLv = lvByName(curName);
      if(heads.indexOf(curName) < 0) heads.push(curName);
      continue;
    }
    if(/^[#＃]/.test(ln) || /^(備註|說明|注意|附註)/.test(ln)) continue;
    let e = "", z = "";
    const tab = ln.indexOf("\t");
    if(tab >= 0){ e = ln.slice(0,tab).trim(); z = ln.slice(tab+1).trim(); }
    else {
      const m = ln.search(/[\u4e00-\u9fff\uff08\uff09]/);
      if(m > 0){ e = ln.slice(0,m).trim(); z = ln.slice(m).trim(); }
    }
    if(!e || !z){ bad.push({line:k+1, text:ln}); continue; }
    rows.push({w:e, z:z, h:curName, lv:curLv, line:k+1});
  }
  return {rows:rows, unknown:unknown, bad:bad, heads:heads};
}
/* 相容用：只回單字列 */
function parseLines(txt){
  return parsePaste(txt).rows.map(function(r){ return {w:r.w, z:r.z, lv:(r.lv >= 1 ? r.lv : null)}; });
}
function viewBatch(){

  h += '<div class="card"><div class="flab" style="margin-top:0">貼上清單</div>'+

       '<b>寫上「L1」「核13」這類標題，下面的字就會自動歸到那一級。</b><br>'+
       '一個標題會一直管到出現下一個標題為止。<br>'+

       '標題是<b>還沒建立過的分級</b>時，會問你要不要順便建立。<br>'+

       '<textarea id="batchIn" rows="10" placeholder="employ 僱用&#10;suffer 受苦&#10;terminal 末期的">'+esc(batchText)+'</textarea>'+
       '<div class="flab">完全沒標題的字要放進哪個分級</div><div class="chips">';
  for(let k=0;k<LEVELS.length;k++){
    const lv=LEVELS[k];
    h += '<button class="chip'+(batchLv===lv?' on':'')+'" data-lvbatch="'+lv+'">'+esc(lvName(lv))+'</button>';
  }
  h += '</div></div>';
  h += '<button class="btn primary" data-act="doBatch">匯入</button>';

function doBatch(){
  const t = document.getElementById("batchIn");
  batchText = t ? t.value : "";
  const P = parsePaste(batchText);
  if(!P.rows.length && !P.unknown.length && !P.bad.length){
    alert("沒有讀到可匯入的單字。\n請確認每一行都是「英文 中文」的格式。"); return;
  }
  /* ① 沒建立過的分級 → 問要不要順便建立 */
  const madeNames = [];
  if(P.unknown.length){
    const names = P.unknown.map(function(u){ return u.name; });
    if(confirm("貼文裡有這些還沒建立的分級：\n　" + names.join("、") +
               "\n\n要現在建立嗎？\n（按「取消」＝這些行會被當成一般文字略過，底下選的那一級只給完全沒標題的字）")){
      for(let k=0;k<names.length;k++){
        const nv = addLevel(names[k]);
        if(S.set.range.indexOf(nv) < 0) S.set.range.push(nv);
        madeNames.push(names[k]);
      }
      S.set.range.sort(function(a,b){ return a-b; });
      for(let k=0;k<P.rows.length;k++){
        if(P.rows[k].h !== null) P.rows[k].lv = lvByName(P.rows[k].h);
      }
    }else{
      /* 不建立 → 這些標題行視為看不懂，列出來讓使用者知道 */
      for(let k=0;k<P.unknown.length;k++) P.bad.push({line:0, text:P.unknown[k].name});
    }
  }
  /* ② 逐列比對：新增／更新／略過 */
  const plan = [], per = {}, fresh = {};
  let noHead = 0, skip = 0, upd = 0;
  for(let k=0;k<LEVELS.length;k++){ per[LEVELS[k]] = 0; fresh[LEVELS[k]] = 0; }
  for(let k=0;k<P.rows.length;k++){
    const row = P.rows[k];
    let lv = (row.h === null) ? batchLv : (row.lv >= 1 ? row.lv : batchLv);
    if(lv < 1 || lv > LEVELS.length) lv = LEVELS[0];
    if(row.h === null) noHead++;
    per[lv] = (per[lv]||0) + 1;
    const lw = row.w.toLowerCase();
    let inPlan = -1, inWords = -1;
    for(let j=0;j<plan.length;j++){ if(plan[j].w.toLowerCase() === lw){ inPlan = j; break; } }
    for(let j=0;j<WORDS.length;j++){ if(WORDS[j].w.toLowerCase() === lw){ inWords = j; break; } }
    if(inPlan >= 0){ skip++; continue; }
    if(inWords >= 0){
      const cur = WORDS[inWords];
      if(cur.z === row.z && cur.lv === lv){ skip++; continue; }
      plan.push({w:row.w, z:row.z, lv:lv, id:cur.id, update:true});
      upd++;
    }else{
      plan.push({w:row.w, z:row.z, lv:lv, id:null, update:false});
    }
    fresh[lv] = (fresh[lv]||0) + 1;
  }
  const addN = plan.length - upd;
  if(!plan.length && !madeNames.length){
    alert("這些字都已經有了，不需要匯入。" + (P.bad.length ? ("\n（另有 " + P.bad.length + " 行看不懂，已略過）") : "")); return;
  }
  /* ③ 確認 */
  let msg = "";
  if(madeNames.length) msg += "新建立分級：" + madeNames.join("、") + "\n\n";
  msg += "偵測到的分級：\n";
  for(let k=0;k<LEVELS.length;k++){
    const lv = LEVELS[k];
    if(!per[lv]) continue;
    msg += "　" + lvName(lv) + "：" + per[lv] + " 個";
    if(fresh[lv] !== per[lv]) msg += "（變更 " + fresh[lv] + "）";
    msg += "\n";
  }
  if(noHead) msg += "　沒有標題的 " + noHead + " 個 → 歸到 " + lvName(batchLv) + "\n";
  msg += "\n新增 " + addN + " 個";
  if(upd) msg += "、更新 " + upd + " 個（釋義或分級有變）";
  if(skip) msg += "、略過重複 " + skip + " 個";
  msg += "。";
  if(P.bad.length){
    msg += "\n\n有 " + P.bad.length + " 行看不懂，會略過：\n";
    for(let k=0;k<Math.min(P.bad.length,4);k++) msg += "　第" + P.bad[k].line + "行：" + P.bad[k].text.slice(0,20) + "\n";
    if(P.bad.length > 4) msg += "　…還有 " + (P.bad.length-4) + " 行\n";
    if(P.bad.some(function(x){ return x.solo; })) msg += "（若那些是你要的分級標題，請先到「分級管理」建立同名分級）\n";
  }
  msg += "\n要匯入嗎？";
  if(!confirm(msg)) return;
  /* ④ 套用 */
  for(let k=0;k<plan.length;k++){
    const it = plan[k];
    if(it.update) S.edit[it.id] = {w:it.w, z:it.z, lv:it.lv};
    else S.custom.push({id:newId(), w:it.w, z:it.z, lv:it.lv});
  }
  rebuild(); save();
  cardState.order=[]; quizState.qs=[]; spellState.qs=[];
  batchText = "";
  let done = "匯入完成：新增 " + addN + " 個";
  if(upd) done += "、更新 " + upd + " 個";
  if(skip) done += "、略過 " + skip + " 個";
  done += "。\n目前共 " + TOTAL + " 字、" + LEVELS.length + " 個分級。";
  alert(done);
  go("manage");
}

/* ---------- 匯出／匯入備份 ---------- */
function backupObj(){
  return {app:"vocab_high_en", ver:3, when:new Date().toISOString(),
          learned:S.learned, wrong:S.wrong, q:S.q, right:S.right, last:S.last,
          set:S.set, custom:S.custom, edit:S.edit, del:S.del, levels:S.levels};
}
function exportData(){
  const txt = JSON.stringify(backupObj());
  const name = "單字備份_" + (new Date().toISOString().slice(0,10)) + ".json";
  try{
    const blob = new Blob([txt], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
  }catch(e){}
  /* iPhone 也可以直接複製下面這串（存到備忘錄或傳給自己） */
  const box = document.getElementById("bkOut");
  if(box){ box.value = txt; box.style.display = "block"; }
  setTimeout(function(){
    const b3 = document.getElementById("bkHint");
    if(b3) b3.style.display = "block";
  }, 300);
}
function importData(){
  let h = header("匯入備份", "貼上先前匯出的內容，或選擇檔案", "manage");
  h += '<div class="card"><div class="flab" style="margin-top:0">選擇檔案</div>'+
       '<input type="file" id="bkFile" accept=".json,application/json" style="width:100%;font-size:14px;padding:8px 0">'+
       '<div class="flab">或直接貼上內容</div>'+
       '<textarea id="bkIn" rows="8" placeholder="貼上備份的 JSON 內容"></textarea></div>';
  h += '<button class="btn primary" data-act="doImport">開始匯入</button>';
  h += '<button class="btn ghost" data-go="manage">取消</button>';
  h += '<div class="tipline" style="text-align:left;margin-top:10px">匯入會<b>覆蓋</b>目前的進度與自訂單字。</div>';
  app.innerHTML = h; bind();
  const f = document.getElementById("bkFile");
  if(f) f.addEventListener("change", function(){
    const file = f.files && f.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = function(){ const t2 = document.getElementById("bkIn"); if(t2) t2.value = String(r.result||""); };
    r.readAsText(file);
  });
  const btn = document.querySelector('[data-act="doImport"]');
  if(btn) btn.addEventListener("click", doImport);
}
function doImport(){
  const el = document.getElementById("bkIn");
  const txt = el ? el.value : "";
  let o = null;
  try{ o = JSON.parse(txt); }catch(e){ alert("這段內容不是有效的備份檔。"); return; }
  if(!o || typeof o !== "object"){ alert("這段內容不是有效的備份檔。"); return; }
  if(!confirm("確定匯入？目前的進度與自訂單字會被覆蓋。")) return;
  const keepSet = S.set;
  /* 借用同一套載入邏輯：把備份內容當成一份存檔來讀 */
  const bkp = o.levels;
  o.levels = (Array.isArray(bkp) && bkp.length) ? bkp : S.levels.slice();
  if(!o.set || typeof o.set !== "object") o.set = keepSet;
  S = load2(o);
  syncLevels();
  rebuild(); save();
  cardState.order=[]; quizState.qs=[]; spellState.qs=[];
  alert("匯入完成：目前共 "+TOTAL+" 字、"+LEVELS.length+" 個分級。");
  go("home");
}

/* ---------- 儲存空間 ---------- */
function showStore(){
  const box = document.getElementById("storeBox"); if(!box) return;
  if(!navigator.storage || !navigator.storage.estimate){ box.innerHTML = "這台裝置的瀏覽器不支援儲存空間查詢。"; return; }
  navigator.storage.estimate().then(function(est){
    const used = est.usage || 0, quota = est.quota || 0;
    let line = "已使用 " + fmtBytes(used) + (quota ? ("／可用約 " + fmtBytes(quota)) : "");
    if(navigator.storage.persisted){
      navigator.storage.persisted().then(function(p){
        box.innerHTML = line + "<br>永久儲存：" + (p ? "✅ 已開啟" : "未開啟（可能被系統自動清理）");
      }).catch(function(){ box.innerHTML = line; });
    }else box.innerHTML = line;
  }).catch(function(){ box.innerHTML = "查不到儲存空間資訊。"; });
}
function fmtBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(2) + " MB";
}
function askPersist(){
  if(!navigator.storage || !navigator.storage.persist){ alert("這台裝置的瀏覽器不支援永久儲存要求。\niPhone 請改用「加到主畫面」。"); return; }
  navigator.storage.persist().then(function(p){
    alert(p ? "已開啟永久儲存 ✅\n瀏覽器不會自動清理這裡的資料。"
            : "這台瀏覽器沒有同意。\niPhone 建議改用「加到主畫面」，可豁免七天清理規則。");
    showStore();
  }).catch(function(){ alert("要求失敗，請改用「加到主畫面」。"); });
}

/* ================= 事件綁定 ================= */
function bind(){
  document.querySelectorAll("[data-go]").forEach(function(el){
    el.addEventListener("click", function(){
      unlockMedia();
      const to = el.getAttribute("data-go");
      const mode = el.getAttribute("data-mode");
      const pool = el.getAttribute("data-pool");
      sfx("tap");
      const tag = tagOf(pool);
      if(to==="card"){
        cardState.order=[]; cardState.pos=0; cardState.flipped=false;
        cardState.base = poolOf(pool); cardState.tag = tag;
      }
      if(to==="quiz"){
        buildQuiz(mode||"en2zh", poolOf(pool), tag);
      }
      if(to==="spell"){
        buildSpell(poolOf(pool), tag);
      }
      if(to==="browse"){
        cardState.base = null; cardState.tag = "";
      }
      go(to, {mode:mode, pool:pool, tag:tag});
    });
  });
  const cbox = document.getElementById("cbox");
  if(cbox) cbox.addEventListener("click", function(){
    cardState.flipped = !cardState.flipped;
    if(cardState.flipped){ sfx("tap"); const i=cardState.order[cardState.pos]; if(i!=null) speak(WORDS[i].w); }
    render();
  });
  document.querySelectorAll("[data-speak]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      unlockMedia();
      speak(el.getAttribute("data-speak"));
    });
  });
  document.querySelectorAll("[data-act]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      const a = el.getAttribute("data-act");
      if(a==="known") cardKnown();
      else if(a==="unknown") cardUnknown();
      else if(a==="flip"){
        cardState.flipped = !cardState.flipped;
        if(cardState.flipped){ const i=cardState.order[cardState.pos]; if(i!=null) speak(WORDS[i].w); }
        render();
      }
      else if(a==="checkSpell") checkSpell();
      else if(a==="nextSpell") nextSpell();
      else if(a==="listen"){ const i=spellState.qs[spellState.pos]; if(i!=null) speak(WORDS[i].w); }
      else if(a==="again"){
        if(lastRun.type==="spell"){ buildSpell(lastRun.pool, lastRun.tag); go("spell", {tag:lastRun.tag}); }
        else { buildQuiz(lastRun.mode, lastRun.pool, lastRun.tag); go("quiz", {tag:lastRun.tag}); }
      }
      else if(a==="testSfx"){ unlockMedia(); SET.sfx=true; sfx("right",3); setTimeout(function(){ sfx("wrong"); }, 700); }
      else if(a==="testSpeak"){ unlockMedia(); speak("employ"); }
      else if(a==="wrongCards"){
        cardState.order = shuffle(wrongIdx());
        cardState.pos = 0; cardState.flipped=false;
        cardState.base = wrongIdx(); cardState.tag = "wrong";
        go("card");
      }
      else if(a==="delWrong"){ delWrongId(el.getAttribute("data-id")); save(); render(); }
      else if(a==="hideIosTip"){ try{ localStorage.setItem("vocab_ios_tip_off","1"); }catch(e2){} render(); }
      else if(a==="newWord"){ editState = {mode:"add", id:"", w:"", z:"", lv:(S.set.range[0]||1)}; go("edit"); }
      else if(a==="batchWord"){ batchLv = (S.set.range[0]||1); go("batch"); }
      else if(a==="saveWord"){ saveWord(); }
      else if(a==="doBatch"){ doBatch(); }
      else if(a==="exportData"){ exportData(); }
      else if(a==="importData"){ importData(); }
      else if(a==="askPersist"){ askPersist(); }
      else if(a==="addLevel"){ addLevelFlow(); }
      else if(a==="resetWrong"){ if(confirm("確定清空錯題本？")){ S.wrong=[]; save(); render(); } }
      else if(a==="resetAll"){
        if(confirm("確定全部重置？學會紀錄與錯題都會歸零。\n（自訂單字與修改不會受影響）")){
          const keep = S.set, kc = S.custom, ke = S.edit, kd = S.del, kl = S.levels;
          S = JSON.parse(JSON.stringify(DEF)); S.set = keep; S.custom = kc; S.edit = ke; S.del = kd;
          S.levels = kl; syncLevels();
          rebuild(); save();
          cardState.order=[]; quizState.qs=[]; spellState.qs=[]; spokenToken=null;
          go("home");
        }
      }
    });
  });
  document.querySelectorAll("[data-opt]").forEach(function(el){
    el.addEventListener("click", function(){ unlockMedia(); answer(parseInt(el.getAttribute("data-opt"),10)); });
  });
  document.querySelectorAll("[data-set]").forEach(function(el){
    el.addEventListener("change", function(){
      unlockMedia();
      SET[el.getAttribute("data-set")] = el.checked;
      if(el.getAttribute("data-set")==="sfx" && el.checked) sfx("right");
    });
  });
  document.querySelectorAll("[data-edit]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); unlockMedia(); sfx("tap");
      const id = el.getAttribute("data-edit");
      const i = idxById(id); if(i<0) return;
      editState = {mode:"edit", id:id, w:WORDS[i].w, z:WORDS[i].z, lv:WORDS[i].lv};
      go("edit");
    });
  });
  document.querySelectorAll("[data-del]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); unlockMedia(); sfx("tap");
      const id = el.getAttribute("data-del");
      const w = wordById(id); if(!w) return;
      if(!confirm("確定刪除「"+w.w+"」？\n（進度紀錄也會一起移除）")) return;
      S.del.push(id);
      const p = S.custom.findIndex(function(c){ return c.id===id; });
      if(p>=0) S.custom.splice(p,1);
      delete S.edit[id];
      delWrongId(id);
      const lk = S.learned.indexOf(id); if(lk>=0) S.learned.splice(lk,1);
      rebuild(); save();
      cardState.order=[]; quizState.qs=[]; spellState.qs=[];
      render();
    });
  });
  document.querySelectorAll("[data-lvrename]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); sfx("tap");
      renameLevelFlow(parseInt(el.getAttribute("data-lvrename"),10));
    });
  });
  document.querySelectorAll("[data-lvdel]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); sfx("tap");
      delLevelFlow(parseInt(el.getAttribute("data-lvdel"),10));
    });
  });
  document.querySelectorAll("[data-mgf]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); sfx("tap");
      mgFilter = parseInt(el.getAttribute("data-mgf"),10) || 0;
      render();
    });
  });
  document.querySelectorAll("[data-lvedit]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); sfx("tap");
      readEditInputs();
      editState.lv = parseInt(el.getAttribute("data-lvedit"),10);
      render();
    });
  });
  document.querySelectorAll("[data-lvbatch]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); sfx("tap");
      const t = document.getElementById("batchIn"); if(t) batchText = t.value;
      batchLv = parseInt(el.getAttribute("data-lvbatch"),10);
      render();
    });
  });
  document.querySelectorAll("[data-lv]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      unlockMedia(); sfx("tap");
      const lv = parseInt(el.getAttribute("data-lv"),10);
      const k = S.set.range.indexOf(lv);
      if(k>=0){
        if(S.set.range.length<=1) return;      /* 至少要留一個範圍 */
        S.set.range.splice(k,1);
      }else{
        S.set.range.push(lv);
      }
      S.set.range.sort(function(a,b){ return a-b; });
      save();
      cardState.order=[]; quizState.qs=[]; spellState.qs=[];   /* 換範圍＝重新出題 */
      render();
    });
  });
  const sp = document.getElementById("spellIn");
  if(sp) sp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); checkSpell(); } });
}

/* 桌面測試友善：鍵盤操作 */
document.addEventListener("keydown", function(e){
  if(view.name==="card"){
    if(e.key===" "){ e.preventDefault(); cardState.flipped=!cardState.flipped; render(); }
    if(e.key==="ArrowRight"){ cardKnown(); }
    if(e.key==="ArrowLeft"){ cardUnknown(); }
  }
});

render();
</script>
